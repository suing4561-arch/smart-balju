<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Balju — 대상정보통신</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--navy:#1a1916;--blue:#1a5fa8;--blue-mid:#2874cc;--line:#e4e0d8;--text:#1a1916;--muted:#6b6860;--dim:#a8a49c;--sans:"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px}
.logo-area{text-align:center;margin-bottom:28px}
.logo-mark{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.logo-title{font-size:28px;font-weight:900;color:var(--navy)}
.logo-sub{font-size:13px;color:var(--muted);margin-top:5px}
.login-card{background:var(--surface);border:.5px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(26,25,22,.08)}
.login-title{font-size:17px;font-weight:700;margin-bottom:16px}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.form-label{font-size:12px;font-weight:700;color:var(--muted)}
.form-input{width:100%;padding:11px 13px;border-radius:10px;border:.5px solid var(--line);background:#faf9f7;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--blue-mid);background:var(--surface)}
.login-btn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--navy);color:#fff;font-size:14px;font-weight:700;font-family:var(--sans);cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.login-btn:hover{opacity:.88}.login-btn:active{opacity:.75}
.error-msg{background:#fdecea;border:.5px solid rgba(192,57,43,.3);border-radius:8px;padding:9px 13px;font-size:13px;color:#c0392b;font-weight:500;display:none;margin-top:8px}
.error-msg.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-spinner.show{display:block}
.footer{text-align:center;margin-top:20px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <div class="logo-mark">Daesang Information</div>
    <div class="logo-title">Smart Balju</div>
    <div class="logo-sub">스마트 발주 통합 시스템</div>
  </div>

  <div class="login-card">
    <div class="login-title">로그인</div>
    <div class="form-field">
      <div class="form-label">아이디</div>
      <input class="form-input" id="loginId" type="text" placeholder="아이디를 입력하세요" autocomplete="username">
    </div>
    <div class="form-field">
      <div class="form-label">비밀번호</div>
      <input class="form-input" id="loginPw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">
      <span id="loginBtnText">로그인</span>
      <div class="btn-spinner" id="loginSpinner"></div>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="footer">© 2026 대상정보통신 · Smart Balju v2.0</div>
</div>


<script src="auth.js"></script>
<script>
let _initDone = false;
let _initTimer = null;
function initApp() {
  if(_initDone) return;
  const Auth = window.SmartBaljuAuth;
  if(!Auth) { setTimeout(initApp, 300); return; }
  if(!Auth.isFirebaseReady) {
    document.addEventListener('firebaseReady', initApp, {once:true});
    return;
  }
  _initDone = true;
  clearTimeout(_initTimer);

  // ── 로그인 ───────────────────────────────────────────────
  document.getElementById('loginId').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPw').focus(); });
  document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginBtn').addEventListener('click', doLogin);

  async function doLogin(){
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const errEl = document.getElementById('errorMsg');
    errEl.classList.remove('show');
    if(!id||!pw){ errEl.textContent='아이디와 비밀번호를 입력하세요.'; errEl.classList.add('show'); return; }
    document.getElementById('loginBtnText').textContent='로그인 중...';
    document.getElementById('loginSpinner').classList.add('show');
    document.getElementById('loginBtn').disabled=true;
    try {
      const result = await Auth.login(id, pw);
      if(result.ok){ Auth.redirectByRole(result.user); }
      else{ errEl.textContent=result.error||'아이디 또는 비밀번호가 올바르지 않습니다.'; errEl.classList.add('show'); }
    } catch(e){
      errEl.textContent='오류가 발생했습니다. 다시 시도해주세요.'; errEl.classList.add('show');
    } finally {
      document.getElementById('loginBtnText').textContent='로그인';
      document.getElementById('loginSpinner').classList.remove('show');
      document.getElementById('loginBtn').disabled=false;
    }
  }

  // 이미 로그인된 경우 자동 이동
  try {
    const session = Auth.getSession();
    if(session) Auth.redirectByRole(session);
  } catch(e) {}

  document.getElementById('loginId').focus();
}

document.addEventListener('firebaseReady', initApp);
_initTimer = setTimeout(initApp, 1000);
</script>
</body>
</html>
