<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Balju — 대상정보통신</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f4f0;--surface:#fff;--navy:#1a1916;--blue:#1a5fa8;--blue-mid:#2874cc;--green-mid:#2d9e65;--amber:#b85c00;--purple:#5a3fb5;--line:#e4e0d8;--text:#1a1916;--muted:#6b6860;--dim:#a8a49c;--mono:"Space Mono",monospace;--sans:"Noto Sans KR",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:420px}
.logo-area{text-align:center;margin-bottom:32px}
.logo-mark{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.logo-title{font-size:28px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
.logo-sub{font-size:14px;color:var(--muted);margin-top:6px}
.login-card{background:var(--surface);border:.5px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 12px 40px rgba(26,25,22,.08)}
.login-title{font-size:18px;font-weight:700;margin-bottom:20px}
.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:.5px solid var(--line);background:#faf9f7;font-size:15px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--blue-mid);background:var(--surface)}
.login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--navy);color:#fff;font-size:15px;font-weight:700;font-family:var(--sans);cursor:pointer;margin-top:6px;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:hover{opacity:.88}.login-btn:active{opacity:.75}
.error-msg{background:#fdecea;border:.5px solid rgba(192,57,43,.3);border-radius:9px;padding:10px 14px;font-size:13px;color:#c0392b;font-weight:500;display:none;margin-top:10px}
.error-msg.show{display:block}
.dev-links{margin-top:20px;border:.5px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.dev-header{padding:10px 16px;border-bottom:.5px solid var(--line);font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.dev-link{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line);text-decoration:none;color:var(--text);transition:background .15s;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;font-family:var(--sans)}
.dev-link:last-child{border-bottom:none}
.dev-link:hover{background:var(--bg)}
.dev-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.dev-name{font-size:14px;font-weight:700;text-align:left}
.dev-sub{font-size:11px;color:var(--muted);margin-top:1px;text-align:left}
.dev-arrow{margin-left:auto;font-size:18px;color:var(--dim)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{width:100%;max-width:400px;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.2)}
.modal-header{padding:18px 20px 14px;border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:50%;background:var(--bg);border:none;font-size:18px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
.modal-list{max-height:60vh;overflow-y:auto}
.modal-item{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:.5px solid var(--line);cursor:pointer;transition:background .15s}
.modal-item:last-child{border-bottom:none}
.modal-item:hover{background:var(--bg)}
.modal-item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.modal-item-name{font-size:14px;font-weight:700}
.modal-item-sub{font-size:11px;color:var(--muted);margin-top:2px}
.modal-item-arrow{margin-left:auto;font-size:16px;color:var(--dim)}
.modal-empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.modal-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:30px;color:var(--muted);font-size:13px}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue-mid);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-spinner.show{display:block}
.footer{text-align:center;margin-top:24px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-area">
    <div class="logo-mark">Daesang Information</div>
    <div class="logo-title">Smart Balju</div>
    <div class="logo-sub">스마트 발주 통합 시스템</div>
  </div>
  <div class="login-card">
    <div class="login-title">로그인</div>
    <div class="form-field">
      <div class="form-label">아이디</div>
      <input class="form-input" id="loginId" type="text" placeholder="아이디를 입력하세요" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginPw').focus()">
    </div>
    <div class="form-field">
      <div class="form-label">비밀번호</div>
      <input class="form-input" id="loginPw" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <span id="loginBtnText">로그인</span>
      <div class="btn-spinner" id="loginSpinner"></div>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <div class="dev-links">
    <div class="dev-header">바로가기 (테스트)</div>
    <button class="dev-link" onclick="openModal('master')">
      <div class="dev-icon" style="background:#f1f5f9;color:#334155">⚙️</div>
      <div><div class="dev-name">Master 관리자</div><div class="dev-sub">계정·권한 관리</div></div>
      <span class="dev-arrow">›</span>
    </button>
    <button class="dev-link" onclick="openModal('hq')">
      <div class="dev-icon" style="background:#e8f0fb;color:#1a5fa8">🏢</div>
      <div><div class="dev-name">본사 관리자</div><div class="dev-sub">기준정보·배송·통계</div></div>
      <span class="dev-arrow">›</span>
    </button>
    <button class="dev-link" onclick="openModal('franchise')">
      <div class="dev-icon" style="background:#e8f5ee;color:#1a7a4a">🏪</div>
      <div><div class="dev-name">가맹점</div><div class="dev-sub">발주·배송추적·매출</div></div>
      <span class="dev-arrow">›</span>
    </button>
    <button class="dev-link" onclick="openModal('supplier')">
      <div class="dev-icon" style="background:#f0eeff;color:#5a3fb5">🚚</div>
      <div><div class="dev-name">납품업체</div><div class="dev-sub">기사등록·배송배정·정산</div></div>
      <span class="dev-arrow">›</span>
    </button>
    <button class="dev-link" onclick="openModal('driver')">
      <div class="dev-icon" style="background:#fef3e2;color:#b85c00">🛵</div>
      <div><div class="dev-name">배송기사</div><div class="dev-sub">배송목록·완료처리</div></div>
      <span class="dev-arrow">›</span>
    </button>
  </div>
  <div class="footer">© 2026 대상정보통신 · Smart Balju v2.0</div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">업체 선택</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-list" id="modalList">
      <div class="modal-loading"><div class="spinner"></div>불러오는 중...</div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>
const Auth = window.SmartBaljuAuth;
async function doLogin() {
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value;
  const errEl = document.getElementById('errorMsg');
  errEl.classList.remove('show');
  if(!id||!pw){ errEl.textContent='아이디와 비밀번호를 입력하세요.'; errEl.classList.add('show'); return; }
  document.getElementById('loginBtnText').textContent='로그인 중...';
  document.getElementById('loginSpinner').classList.add('show');
  document.getElementById('loginBtn').disabled=true;
  try {
    const result = await Auth.login(id, pw);
    if(result.ok){ Auth.redirectByRole(result.user); }
    else{ errEl.textContent=result.error; errEl.classList.add('show'); }
  } catch(e){
    errEl.textContent='오류가 발생했습니다. 다시 시도해주세요.'; errEl.classList.add('show');
  } finally {
    document.getElementById('loginBtnText').textContent='로그인';
    document.getElementById('loginSpinner').classList.remove('show');
    document.getElementById('loginBtn').disabled=false;
  }
}
const _session = Auth.getSession();
if(_session) Auth.redirectByRole(_session);
window.addEventListener('load',()=>document.getElementById('loginId').focus());

const PAGE_MAP = {
  master:    {title:'Master 관리자',    url:'master.html',          icon:'⚙️', color:'#f1f5f9', tc:'#334155'},
  hq:        {title:'본사 관리자 선택', url:'site_hq.html',         icon:'🏢', color:'#e8f0fb', tc:'#1a5fa8'},
  franchise: {title:'가맹점 선택',      url:'site_franchise.html',  icon:'🏪', color:'#e8f5ee', tc:'#1a7a4a'},
  supplier:  {title:'납품업체 선택',    url:'site_supplier.html',   icon:'🚚', color:'#f0eeff', tc:'#5a3fb5'},
  driver:    {title:'배송기사 선택',    url:'site_driver.html',     icon:'🛵', color:'#fef3e2', tc:'#b85c00'},
};
let _currentRole = '';
async function openModal(role) {
  _currentRole = role;
  const cfg = PAGE_MAP[role];
  document.getElementById('modalTitle').textContent = cfg.title;
  document.getElementById('modalList').innerHTML = '<div class="modal-loading"><div class="spinner"></div>불러오는 중...</div>';
  document.getElementById('modalOverlay').classList.add('show');
  if(role === 'master'){ closeModal(); location.href = cfg.url; return; }
  try {
    const users = await Auth.loadUsers();
    const filtered = users.filter(u => u.role === role && u.status === 'active');
    renderModalList(filtered, cfg);
  } catch(e) {
    document.getElementById('modalList').innerHTML = '<div class="modal-empty">불러오기 실패: '+e.message+'</div>';
  }
}
function renderModalList(users, cfg) {
  const el = document.getElementById('modalList');
  if(!users.length){
    el.innerHTML = `<div class="modal-empty">등록된 ${cfg.title.replace(' 선택','')}이 없습니다.<br><span style="font-size:12px;color:var(--dim)">Master에서 먼저 계정을 생성하세요</span><br><br><button onclick="selectUser(null,'${_currentRole}')" style="padding:10px 20px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-size:13px;font-weight:700;cursor:pointer">그냥 입장하기</button></div>`;
    return;
  }
  el.innerHTML = users.map(u => `<div class="modal-item" onclick="selectUser('${u.uid}','${_currentRole}')"><div class="modal-item-icon" style="background:${cfg.color};color:${cfg.tc}">${cfg.icon}</div><div><div class="modal-item-name">${u.businessName||u.name||u.loginId}</div><div class="modal-item-sub">${u.name||''} ${u.businessNumber?'· '+u.businessNumber:''} ${u.brandName?'· '+u.brandName:''}</div></div><span class="modal-item-arrow">›</span></div>`).join('') +
    `<div class="modal-item" onclick="selectUser(null,'${_currentRole}')" style="border-top:.5px solid var(--line)"><div class="modal-item-icon" style="background:var(--bg);color:var(--muted)">👤</div><div><div class="modal-item-name" style="color:var(--muted)">선택 없이 입장</div><div class="modal-item-sub">테스트 모드</div></div><span class="modal-item-arrow">›</span></div>`;
}
function selectUser(uid, role) {
  const cfg = PAGE_MAP[role];
  if(uid) {
    Auth.loadUsers().then(users => {
      const user = users.find(u => u.uid === uid);
      if(user) Auth.setSession(user);
      closeModal(); location.href = cfg.url;
    });
  } else { closeModal(); location.href = cfg.url; }
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
</script>
</body>
</html>
