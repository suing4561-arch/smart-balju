<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대상정보통신 Master</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#162033;--muted:#6b7280;--line:#dbe3ee;--navy:#17233c;--blue:#2563eb;--green:#16a34a;--yellow:#d97706;--red:#dc2626;--shadow:0 14px 40px rgba(20,31,51,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:0}
.brand-name{font-size:17px;font-weight:900;color:#fff}
.brand-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}
.side-section{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase;padding:18px 4px 6px}
.side-btn{border:0;border-radius:9px;padding:10px 13px;text-align:left;background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);font-weight:700;font-size:13px;transition:background .15s;margin-bottom:5px;width:100%}
.side-btn:hover{background:rgba(255,255,255,.14)}
.side-btn.active{background:#fff;color:var(--navy)}
.side-footer{margin-top:auto;padding-top:14px;border-top:.5px solid rgba(255,255,255,.1)}
.main{padding:26px;overflow:auto}
.page-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:22px;font-weight:900}
.page-sub{font-size:13px;color:var(--muted);margin-top:3px}
.btn{border:1px solid var(--line);border-radius:9px;padding:9px 14px;background:var(--panel);color:var(--text);font-weight:700}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:700}
input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--blue)}

/* HQ 카드 그리드 */
.hq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.hq-card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.hq-card:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.hq-card.selected{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.hq-card.no-brand{opacity:.75;cursor:default}
.hq-card.no-brand:hover{border-color:var(--line);box-shadow:var(--shadow)}
.hq-name{font-size:16px;font-weight:900;margin-bottom:4px}
.hq-brand{font-size:12px;color:var(--muted);margin-bottom:10px}
.hq-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
.badge-active{background:#ecfdf5;color:#047857}
.badge-inactive{background:#f1f5f9;color:#475569}
.badge-suspended{background:#fef2f2;color:#b91c1c}
.badge-expired{background:#fff7ed;color:#c2410c}
.badge-warn{background:#fef9c3;color:#854d0e}
.badge-blue{background:#eff6ff;color:#1d4ed8}

/* 선택된 본사 진입 패널 */
.enter-panel{background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%);border:1.5px solid var(--blue);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.enter-panel-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px}
.enter-panel-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.enter-btns{display:flex;gap:10px;flex-wrap:wrap}
.enter-btn{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.enter-btn:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff}
.enter-btn .icon{font-size:18px}

/* 계정 관리 테이블 */
.status-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sf{border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.sf.active{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}
.role-hq{background:#eff6ff;color:#1d4ed8}
.status-active{background:#ecfdf5;color:#047857}.status-inactive{background:#f1f5f9;color:#475569}
.status-suspended{background:#fef2f2;color:#b91c1c}.status-expired{background:#fff7ed;color:#c2410c}
.mini{border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;margin:2px}
.mini.blue{color:var(--blue)}.mini.green{color:var(--green)}.mini.red{color:var(--red)}.mini.yellow{color:var(--yellow)}
.muted{color:var(--muted);font-size:12px}

/* 모달 */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.55);z-index:50;padding:16px}
.modal.show{display:flex}
.modal-box{width:100%;max-width:580px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.25);max-height:92vh;overflow-y:auto}
.modal-box h2{font-size:17px;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-divider{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding-top:10px;margin-top:4px;border-top:1px solid var(--line)}
.form-full{grid-column:1/-1}
.perm-section{margin-bottom:14px}
.perm-title{font-size:13px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px}
.perm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.perm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.perm-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.perm-row.active{background:#eff6ff;border-color:var(--blue)}
.perm-row input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.perm-lbl{font-size:12px;font-weight:700}.perm-sub{font-size:10px;color:var(--muted);margin-top:1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;font-size:13px;opacity:0;transition:.2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view{display:none}.view.active{display:block}
</style>
</head>
<body>
<div class="shell">

  <!-- 사이드바 -->
  <aside class="side">
    <div>
      <div class="brand-name">대상정보통신</div>
      <div class="brand-sub">Smart Balju Master</div>
    </div>

    <div class="side-section">화면</div>
    <button class="side-btn active" id="nav-main" onclick="showView('main')">🏢 본사 선택</button>
    <button class="side-btn"        id="nav-manage" onclick="showView('manage')">⚙ 본사 계정 관리</button>

    <div class="side-footer">
      <button class="side-btn" onclick="Auth.logout()" style="background:rgba(220,38,38,.2);color:#fca5a5">로그아웃</button>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">

    <!-- ── 뷰1: 본사 선택 관문 ── -->
    <div class="view active" id="view-main">
      <div class="page-top">
        <div>
          <div class="page-title">본사 선택</div>
          <div class="page-sub muted">진입할 본사(브랜드)를 선택하세요</div>
        </div>
        <button class="btn primary" onclick="openEditor()">+ 본사 계정 추가</button>
      </div>

      <!-- 선택된 본사 진입 패널 -->
      <div class="enter-panel" id="enterPanel" style="display:none">
        <div class="enter-panel-title" id="enterPanelTitle"></div>
        <div class="enter-panel-sub" id="enterPanelSub"></div>
        <div class="enter-btns">
          <button class="enter-btn" onclick="enterSite('site_hq.html')">
            <span class="icon">🏛</span><span>본사 관리화면</span>
          </button>
          <button class="enter-btn" onclick="enterSite('site_franchise.html')">
            <span class="icon">🏪</span><span>가맹점 화면</span>
          </button>
          <button class="enter-btn" onclick="enterSite('site_supplier.html')">
            <span class="icon">🚚</span><span>납품업체 화면</span>
          </button>
          <button class="btn" onclick="deselectHq()" style="margin-left:auto">취소</button>
        </div>
      </div>

      <!-- 본사 카드 목록 -->
      <div class="hq-grid" id="hqGrid">
        <div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">
          <div class="spinner" style="margin:0 auto 12px"></div>불러오는 중...
        </div>
      </div>
    </div>

    <!-- ── 뷰2: 본사 계정 관리 ── -->
    <div class="view" id="view-manage">
      <div class="page-top">
        <div>
          <div class="page-title">본사 계정 관리</div>
          <div class="page-sub muted">HQ 계정 생성·수정·상태변경·권한부여</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="refreshAll()">새로고침</button>
          <button class="btn primary" onclick="openEditor()">+ 본사 계정 추가</button>
        </div>
      </div>
      <div class="card">
        <div class="status-filters" id="manageStatusFilters"></div>
        <div style="overflow:auto">
          <table>
            <thead><tr>
              <th>본사명</th><th>브랜드</th><th>로그인ID</th><th>상태</th><th>관리</th>
            </tr></thead>
            <tbody id="manageBody">
              <tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted)">불러오는 중...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- 계정 생성/수정 모달 -->
<div class="modal" id="editorModal">
  <div class="modal-box">
    <h2 id="editorTitle">본사 계정 생성</h2>
    <div class="form-grid">
      <div><label>상태</label>
        <select id="fStatus">
          <option value="active">정상</option>
          <option value="inactive">비활성</option>
          <option value="suspended">사용중지</option>
          <option value="expired">계약만료</option>
        </select>
      </div>
      <div></div>

      <div class="form-divider">기본 정보</div>
      <div><label>담당자명</label><input id="fName" placeholder="홍길동"></div>
      <div><label>상호명 (본사명)</label><input id="fBusinessName" placeholder="이바구밀면 본사"></div>
      <div><label>사업자번호</label><input id="fBusinessNumber" placeholder="000-00-00000"></div>
      <div><label>연락처</label><input id="fPhone" placeholder="010-0000-0000"></div>

      <div class="form-divider">로그인 정보</div>
      <div><label>로그인 ID</label><input id="fLoginId" placeholder="아이디"></div>
      <div><label>비밀번호 <span style="font-weight:400;color:var(--muted)">(수정 시 비워두면 유지)</span></label>
        <input id="fPassword" type="password" placeholder="비밀번호"></div>

      <div class="form-divider">브랜드 연동</div>
      <div><label>브랜드명</label><input id="fBrandName" placeholder="이바구밀면"></div>
      <div><label>브랜드 코드 <span style="font-weight:400;color:var(--muted)">(2자리, 예: IB)</span></label><input id="fBrandCode" placeholder="IB" maxlength="4" style="text-transform:uppercase"></div>

    </div>

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn" onclick="closeModal('editorModal')">취소</button>
      <button class="btn primary" onclick="saveEditor()">저장</button>
    </div>
  </div>
</div>

<!-- 권한부여 모달 -->
<div class="modal" id="permModal">
  <div class="modal-box" style="max-width:640px">
    <h2>권한부여</h2>
    <div id="permTarget" style="color:var(--muted);margin-bottom:16px;font-size:14px"></div>
    <div id="permGrid"></div>
    <div style="margin-top:8px;padding:10px 14px;background:#f8fafc;border-radius:8px;font-size:12px;color:var(--muted)">
      체크된 기능만 해당 계정에서 표시됩니다. 결제 플랜에 따라 차등 부여하세요.
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" onclick="closeModal('permModal')">취소</button>
      <button class="btn primary" onclick="savePerm()">저장</button>
    </div>
  </div>
</div>

<!-- 상세보기 모달 -->
<div class="modal" id="detailModal">
  <div class="modal-box">
    <h2>계정 상세</h2>
    <pre id="detailPre" style="white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;max-height:55vh;overflow:auto"></pre>
    <div style="text-align:right;margin-top:14px">
      <button class="btn primary" onclick="closeModal('detailModal')">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script>
const Auth = window.SmartBaljuAuth;

// ── 상태 ───────────────────────────────────────────────────
let _users = [], _brands = [];
let _editUid = '', _permUid = '';
let _selectedHq = null;
let _manageStatus = 'all';

const SITE_URL = {hq:'site_hq.html', franchise:'site_franchise.html', supplier:'site_supplier.html'};
const PERM_DEFS = {
  hq:{label:'본사 기능',dot:'#3b82f6',items:[
    {key:'hq_dashboard',label:'대시보드',sub:'매출·KPI'},
    {key:'hq_orders',label:'주문 관리',sub:'발주 승인·반려'},
    {key:'hq_delivery',label:'배송 관리',sub:'배송 현황'},
    {key:'hq_register',label:'기준정보 등록',sub:'거래처·메뉴·가격'},
    {key:'hq_partners',label:'거래처 관리',sub:'납품업체 목록'},
    {key:'hq_stats',label:'통계·분석',sub:'매출 분석'},
    {key:'hq_settle',label:'정산 관리',sub:'입출금 정산'},
    {key:'hq_notice',label:'공지·레시피',sub:'공지사항 관리'},
    {key:'hq_okpos',label:'OKPos 연동',sub:'자동 매출 수집'},
  ]},
  franchise:{label:'가맹점 기능',dot:'#10b981',items:[
    {key:'fr_home',label:'홈·대시보드',sub:'수발주·재고'},
    {key:'fr_order',label:'발주하기',sub:'품목 선택·장바구니'},
    {key:'fr_delivery',label:'배송 추적',sub:'실시간 배송'},
    {key:'fr_sales',label:'매출 현황',sub:'일별·월별 매출'},
    {key:'fr_stats',label:'통계',sub:'매출 분석 차트'},
  ]},
  supplier:{label:'납품업체 기능',dot:'#f97316',items:[
    {key:'sup_register',label:'등록관리',sub:'기사·가맹점 등록'},
    {key:'sup_assign',label:'배송배정',sub:'배송 생성·기사 배정'},
    {key:'sup_slip',label:'전표출력',sub:'배송전표·링크복사'},
    {key:'sup_settle',label:'정산관리',sub:'납품 내역·정산'},
  ]},
};

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
let _tt;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2600);}
function closeModal(id){document.getElementById(id).classList.remove('show');}

// ── 뷰 전환 ────────────────────────────────────────────────
function showView(v){
  ['main','manage'].forEach(k=>{
    document.getElementById('view-'+k).classList.toggle('active', k===v);
    document.getElementById('nav-'+k).classList.toggle('active', k===v);
  });
  if(v==='manage') renderManageTable();
}

// ── 본사 카드 렌더 ─────────────────────────────────────────
function renderHqCards(){
  const hqList = _users.filter(u => u.role === 'hq');
  const grid = document.getElementById('hqGrid');
  if(!hqList.length){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)">등록된 본사 계정이 없습니다.<br><br><button class="btn primary" onclick="openEditor()" style="margin-top:8px">+ 본사 계정 추가</button></div>';
    return;
  }
  grid.innerHTML = hqList.map(u => {
    const hasBrand = !!u.brandId;
    const statusClass = {active:'badge-active',inactive:'badge-inactive',suspended:'badge-suspended',expired:'badge-expired'}[u.status] || 'badge-inactive';
    const statusLabel = {active:'활성',inactive:'비활성',suspended:'중지',expired:'만료'}[u.status] || u.status;
    const isSelected = _selectedHq?.uid === u.uid;
    return `<div class="hq-card${hasBrand?'':' no-brand'}${isSelected?' selected':''}" onclick="${hasBrand?`selectHq('${esc(u.uid)}')`:'void(0)'}">
      <div class="hq-name">${esc(u.businessName || u.name || u.loginId)}</div>
      <div class="hq-brand">${hasBrand ? '🏷 '+esc(u.brandName||u.brandId) : '브랜드 미연결'}</div>
      <div class="hq-badges">
        <span class="badge ${statusClass}">${statusLabel}</span>
        ${hasBrand ? `<span class="badge badge-blue">brandId: ${esc(u.brandId)}</span>` : '<span class="badge badge-warn">⚠ 브랜드 미연결 — 진입 불가</span>'}
      </div>
      ${hasBrand
        ? `<button onclick="event.stopPropagation();selectHq('${esc(u.uid)}')" style="width:100%;padding:9px;border-radius:9px;border:1.5px solid ${isSelected?'var(--blue)':'var(--line)'};background:${isSelected?'var(--blue)':'#fff'};color:${isSelected?'#fff':'var(--text)'};font-weight:700;font-size:13px;transition:all .15s">${isSelected?'✓ 선택됨':'이 본사로 진입'}</button>`
        : `<div style="padding:9px;text-align:center;border-radius:9px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:700">브랜드 연결 필요</div>`
      }
    </div>`;
  }).join('');
}

// ── 본사 선택 ──────────────────────────────────────────────
function selectHq(uid){
  _selectedHq = _users.find(u => u.uid === uid) || null;
  renderHqCards();
  const panel = document.getElementById('enterPanel');
  if(!_selectedHq){ panel.style.display='none'; return; }
  document.getElementById('enterPanelTitle').textContent =
    `"${_selectedHq.businessName || _selectedHq.name}" 선택됨`;
  document.getElementById('enterPanelSub').textContent =
    `브랜드: ${_selectedHq.brandName || _selectedHq.brandId} · 진입할 화면을 선택하세요`;
  panel.style.display = '';
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function deselectHq(){
  _selectedHq = null;
  document.getElementById('enterPanel').style.display = 'none';
  renderHqCards();
}

// ── 화면 진입 (★ brandId 세션 확실히 전달) ─────────────────
function enterSite(url){
  if(!_selectedHq){ toast('본사를 먼저 선택하세요'); return; }
  if(!_selectedHq.brandId){ toast('brandId가 없습니다. 계정 수정에서 브랜드를 연결하세요'); return; }
  Auth.setSession(_selectedHq);   // user 객체 전체 저장 → brandId 포함
  location.href = url;
}

// ── 계정 관리 테이블 ────────────────────────────────────────
function renderManageTable(){
  const STATUS_LIST = [['all','전체'],['active','활성'],['inactive','비활성'],['suspended','중지'],['expired','만료']];
  document.getElementById('manageStatusFilters').innerHTML = STATUS_LIST.map(([k,l])=>
    `<button class="sf ${_manageStatus===k?'active':''}" onclick="_manageStatus='${k}';renderManageTable()">${l}</button>`
  ).join('');

  const hqList = _users.filter(u => u.role === 'hq' && (_manageStatus==='all' || u.status===_manageStatus));
  const body = document.getElementById('manageBody');
  if(!hqList.length){
    body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:32px">해당 계정이 없습니다.</td></tr>';
    return;
  }
  body.innerHTML = hqList.map(u => {
    const statusLabel = {active:'활성',inactive:'비활성',suspended:'중지',expired:'만료'}[u.status] || u.status;
    const statusClass = {active:'status-active',inactive:'status-inactive',suspended:'status-suspended',expired:'status-expired'}[u.status] || '';
    return `<tr>
      <td><strong>${esc(u.businessName||u.name||'-')}</strong><div class="muted">${esc(u.name||'')} · ${esc(u.loginId)}</div></td>
      <td>${u.brandId ? `<span style="font-size:12px;font-weight:700;color:var(--blue)">${esc(u.brandName||'')} <span style="color:var(--muted)">(${esc(u.brandId)})</span></span>` : '<span style="color:var(--red);font-size:12px;font-weight:700">⚠ 미연결</span>'}</td>
      <td class="muted">${esc(u.loginId)}</td>
      <td><span class="pill ${statusClass}">${statusLabel}</span></td>
      <td><div style="display:flex;flex-wrap:wrap">
        <button class="mini blue" onclick="openEditor('${esc(u.uid)}')">수정</button>
        <button class="mini green" onclick="doStatus('${esc(u.uid)}','active')">활성</button>
        <button class="mini" onclick="doStatus('${esc(u.uid)}','inactive')">비활성</button>
        <button class="mini yellow" onclick="doStatus('${esc(u.uid)}','suspended')">중지</button>
        <button class="mini red" onclick="doStatus('${esc(u.uid)}','expired')">만료</button>
        <button class="mini blue" onclick="doResetPw('${esc(u.uid)}')">비번초기화</button>
        <button class="mini blue" onclick="openPerm('${esc(u.uid)}')">권한</button>
        <button class="mini" onclick="showDetail('${esc(u.uid)}')">상세</button>
        <button class="mini red" onclick="doDelete('${esc(u.uid)}')">삭제</button>
      </div></td>
    </tr>`;
  }).join('');
}

// ── 전체 새로고침 ──────────────────────────────────────────
async function refreshAll(){
  _users = await Auth.loadUsers();
  _brands = await Auth.loadBrands();
  renderHqCards();
  if(document.getElementById('view-manage').classList.contains('active')) renderManageTable();
}

// ── 계정 편집 ──────────────────────────────────────────────
async function openEditor(uid){
  _editUid = uid || '';
  const u = uid ? _users.find(x => x.uid === uid) : null;
  document.getElementById('editorTitle').textContent = u ? '본사 계정 수정' : '본사 계정 생성';
  ['fName','fBusinessName','fBusinessNumber','fPhone','fLoginId','fPassword','fBrandName','fBrandCode']
    .forEach(id => { const el = document.getElementById(id); if(el) el.value = ''; });
  if(u){
    document.getElementById('fStatus').value = u.status;
    document.getElementById('fName').value = u.name || '';
    document.getElementById('fBusinessName').value = u.businessName || '';
    document.getElementById('fBusinessNumber').value = u.businessNumber || '';
    document.getElementById('fPhone').value = u.phone || '';
    document.getElementById('fLoginId').value = u.loginId || '';
    document.getElementById('fBrandName').value = u.brandName || '';
    // 기존 브랜드 코드는 brands에서 조회
    if(u.brandId){
      const brands = await Auth.loadBrands();
      const b = brands.find(x => x.id === u.brandId);
      if(b) document.getElementById('fBrandCode').value = b.code || '';
    }
  } else {
    document.getElementById('fStatus').value = 'active';
    document.getElementById('fPassword').value = '1234';
  }
  document.getElementById('editorModal').classList.add('show');
}

async function saveEditor(){
  if(!document.getElementById('fLoginId').value.trim()){ toast('로그인 ID를 입력하세요'); return; }
  const brandName = document.getElementById('fBrandName').value.trim();
  const brandCode = document.getElementById('fBrandCode').value.trim().toUpperCase();
  if(!brandName){ toast('브랜드명을 입력하세요'); return; }

  // 동일 이름 브랜드 조회 → 없으면 신규 생성
  const brands = await Auth.loadBrands();
  let brand = brands.find(b => b.name === brandName);
  if(!brand) brand = await Auth.registerBrand({ name: brandName, code: brandCode });

  await Auth.upsertUser({
    uid: _editUid,
    role: 'hq',
    status: document.getElementById('fStatus').value,
    name: document.getElementById('fName').value,
    businessName: document.getElementById('fBusinessName').value,
    businessNumber: document.getElementById('fBusinessNumber').value,
    phone: document.getElementById('fPhone').value,
    loginId: document.getElementById('fLoginId').value,
    password: document.getElementById('fPassword').value || undefined,
    brandId: brand.id,
    brandName: brand.name,
  });
  closeModal('editorModal');
  await refreshAll();
  toast('저장 완료');
}

// ── 상태·비번·삭제·상세 ────────────────────────────────────
async function doStatus(uid,s){ await Auth.setUserStatus(uid,s); await refreshAll(); toast('상태 변경'); }
async function doResetPw(uid){
  const r = await Auth.resetPasswordByMaster(uid);
  await refreshAll();
  alert(`임시 비밀번호 발급\n\n계정: ${r.user.loginId}\n임시 비밀번호: ${r.tempPassword}\n\n로그인 후 변경 필요`);
}
async function doDelete(uid){
  if(!confirm('삭제할까요?')) return;
  await Auth.deleteUser(uid);
  await refreshAll();
  toast('삭제 완료');
}
function showDetail(uid){
  const u = _users.find(x => x.uid === uid);
  const s = {...u}; delete s.passwordHash; delete s.okposPw;
  document.getElementById('detailPre').textContent = JSON.stringify(s, null, 2);
  document.getElementById('detailModal').classList.add('show');
}

// ── 권한부여 ───────────────────────────────────────────────
function openPerm(uid){
  _permUid = uid;
  const u = _users.find(x => x.uid === uid);
  const p = u?.permissions || {};
  document.getElementById('permTarget').innerHTML = `<strong>${u?.businessName||u?.name||uid}</strong> 에게 부여할 기능을 선택하세요.`;
  document.getElementById('permGrid').innerHTML = Object.entries(PERM_DEFS).map(([rk,def])=>`
    <div class="perm-section">
      <div class="perm-title">
        <div class="perm-dot" style="background:${def.dot}"></div>
        ${def.label}
        <button onclick="setAll('${rk}',true)" style="margin-left:auto;font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer">전체선택</button>
        <button onclick="setAll('${rk}',false)" style="font-size:11px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer">전체제거</button>
      </div>
      <div class="perm-grid">
        ${def.items.map(it=>`
          <label class="perm-row ${p[it.key]?'active':''}" id="pr_${it.key}">
            <input type="checkbox" id="pc_${it.key}" ${p[it.key]?'checked':''} onchange="togglePerm('${it.key}')">
            <div><div class="perm-lbl">${it.label}</div><div class="perm-sub">${it.sub}</div></div>
          </label>`).join('')}
      </div>
    </div>`).join('');
  document.getElementById('permModal').classList.add('show');
}
function togglePerm(k){ const c=document.getElementById('pc_'+k).checked; document.getElementById('pr_'+k).classList.toggle('active',c); }
function setAll(rk,v){ PERM_DEFS[rk].items.forEach(it=>{ const el=document.getElementById('pc_'+it.key); if(el){ el.checked=v; document.getElementById('pr_'+it.key).classList.toggle('active',v); } }); }
async function savePerm(){
  const perms = {};
  Object.values(PERM_DEFS).forEach(def => def.items.forEach(it => { perms[it.key] = document.getElementById('pc_'+it.key)?.checked || false; }));
  await Auth.setPermissions(_permUid, perms);
  await refreshAll();
  closeModal('permModal');
  toast('권한 저장 완료');
}

// ── 시작 ───────────────────────────────────────────────────
document.addEventListener('firebaseReady', refreshAll);
if(Auth.isFirebaseReady) refreshAll();
else setTimeout(refreshAll, 2000);
</script>
</body>
</html>
