name: OKPos sales collector

on:
  schedule:
    - cron: "0 17 * * *" # 02:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect OKPos sales and save to Firebase
        env:
          OKPOS_ID: ${{ secrets.OKPOS_ID }}
          OKPOS_PW: ${{ secrets.OKPOS_PW }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: python okpos_scraper.py
