name: OKPos 매출 자동 수집

on:
  schedule:
    # 매일 새벽 2시 KST = UTC 17:00 (전날)
    - cron: '0 17 * * *'

  # 수동 실행 (Actions 탭에서 "Run workflow" 버튼)
  workflow_dispatch:
    inputs:
      date_from:
        description: '수집 시작일 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        default: ''
      date_to:
        description: '수집 종료일 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 Firebase 서비스 계정 키 생성
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-credentials.json
          python -c "import json; json.load(open('firebase-credentials.json'))"
          echo "✅ Firebase 키 파일 생성 완료"

      - name: 🕐 KST 시간 출력
        run: |
          export TZ='Asia/Seoul'
          echo "현재 KST 시각: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "수집 대상: $(date -d 'yesterday' '+%Y-%m-%d') (어제)"

      - name: 🚀 OKPos 매출 수집 실행
        env:
          OKPOS_ID: ${{ secrets.OKPOS_ID }}
          OKPOS_PW: ${{ secrets.OKPOS_PW }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_CREDENTIAL_PATH: firebase-credentials.json
          TZ: Asia/Seoul
        run: |
          if [ -n "${{ inputs.date_from }}" ] && [ -n "${{ inputs.date_to }}" ]; then
            echo "📅 수동 실행: ${{ inputs.date_from }} ~ ${{ inputs.date_to }}"
            python okpos_scraper.py "${{ inputs.date_from }}" "${{ inputs.date_to }}"
          else
            echo "📅 자동 실행: 어제 데이터 수집"
            python okpos_scraper.py
          fi

      - name: 🧹 임시 파일 정리
        if: always()
        run: |
          rm -f firebase-credentials.json
          echo "✅ Firebase 키 파일 삭제 완료"
